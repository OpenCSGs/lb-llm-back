name: "Gitleaks"

on:
  pull_request:

env:
  ACTIONS_STEP_DEBUG: '${{ secrets.ACTIONS_STEP_DEBUG }}'
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: "Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Download and configure gitleaks
        shell: bash
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "Download Gitleaks ${GITLEAKS_VERSION} from ${DOWNLOAD_URL}"
          curl -fsSL "$DOWNLOAD_URL" | tar xzf - -C /usr/local/bin
          chmod +x /usr/local/bin/gitleaks

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.after }}

      - name: Run gitleaks
        run: |
          set -euo pipefail ${ACTIONS_STEP_DEBUG:+-x}

          gitleaks \
            detect \
            --source="." \
            --redact \
            -v \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-level=debug \
            --log-opts='${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.event.after }}'

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: GitLeaks results
          path: results.sarif