services:
  ml-backend:
    container_name: ml-backend
    image: humansignal/ml-backend:v0
    env_file:
      - .env
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
      args:
        TEST_ENV: ${TEST_ENV:-false}

#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [ gpu ]


    environment:
      # specify these parameters if you want to use basic auth for the model server
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      # set the log level for the model server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # any other parameters that you want to pass to the model server
      - ANY=PARAMETER
      # specify the number of workers and threads for the model server
      - WORKERS=${WORKERS:-1}
      - THREADS=${THREADS:-8}
      # specify the model directory (likely you don't need to change this)
      - MODEL_DIR=${MODEL_DIR:-/data/models}
      # specify device
      - DEVICE=${DEVICE:-cuda}
      # SAM2 model config
      - MODEL_CONFIG=${MODEL_CONFIG:-configs/sam2.1/sam2.1_hiera_l.yaml}
      # SAM2 checkpoint
      - MODEL_CHECKPOINT=${MODEL_CHECKPOINT:-sam2.1_hiera_large.pt}

      # Global model switch for every supported template. false keeps dedicated models.
      - USE_THIRD_PARTY_MODELS=${USE_THIRD_PARTY_MODELS:-false}
      - VOLC_ACCESSKEY=${VOLC_ACCESSKEY:-}
      - VOLC_SECRETKEY=${VOLC_SECRETKEY:-}
      - VOLCENGINE_ENTITY_SEGMENT_MODEL=${VOLCENGINE_ENTITY_SEGMENT_MODEL:-entity_seg}
      - VOLCENGINE_ENTITY_SEGMENT_MAX_ENTITY=${VOLCENGINE_ENTITY_SEGMENT_MAX_ENTITY:-10}
      - VOLCENGINE_ENTITY_SEGMENT_REFINE_MASK=${VOLCENGINE_ENTITY_SEGMENT_REFINE_MASK:-1}
      - VOLCENGINE_ENTITY_SEGMENT_RETURN_FORMAT=${VOLCENGINE_ENTITY_SEGMENT_RETURN_FORMAT:-3}
      - VOLCENGINE_POLYGON_MIN_AREA=${VOLCENGINE_POLYGON_MIN_AREA:-50}
      - VOLCENGINE_POLYGON_SIMPLIFY_PX=${VOLCENGINE_POLYGON_SIMPLIFY_PX:-2.0}
      # Optional. If empty, the first BrushLabels label is used.
      - VOLCENGINE_ENTITY_SEGMENT_LABEL=${VOLCENGINE_ENTITY_SEGMENT_LABEL:-}
      # Reserved for semantic classification; the current first stage does not call Doubao.
      - ARK_API_KEY=${ARK_API_KEY:-}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-seed-2-1-turbo-260628}
      - ARK_BASE_URL=${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - DOUBAO_TIMEOUT=${DOUBAO_TIMEOUT:-360}
      - DOUBAO_MAX_IMAGE_SIZE=${DOUBAO_MAX_IMAGE_SIZE:-640}

      # Specify the Label Studio URL and API key to access
      # uploaded, local storage and cloud storage files.
      # Do not use 'localhost' as it does not work within Docker containers.
      # Use prefix 'http://' or 'https://' for the URL always.
      # Determine the actual IP using 'ifconfig' (Linux/Mac) or 'ipconfig' (Windows).
      - LABEL_STUDIO_URL=${LABEL_STUDIO_URL:-}
      - LABEL_STUDIO_CONTAINER_MEDIA_ROOT=${LABEL_STUDIO_CONTAINER_MEDIA_ROOT:-/label-studio-media}
    ports:
      - "${ML_BACKEND_PORT:-9090}:9090"
    volumes:
      - "./label_studio_ml/examples/segment_anything_2_image/data/server:/data"
      - "${LABEL_STUDIO_LOCAL_MEDIA_ROOT}:/label-studio-media:ro"
